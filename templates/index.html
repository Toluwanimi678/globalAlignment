
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Alignment Tool</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        textarea,
        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #eef2ff;
            border-radius: 10px;
        }

        .alignment {
            font-family: monospace;
            font-size: 18px;
            margin-top: 10px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🧬 Global Sequence Alignment</h1>

    <form method="POST">

        <label>Sequence 1</label>
        <textarea name="seq1" rows="3" required></textarea>

        <label>Sequence 2</label>
        <textarea name="seq2" rows="3" required></textarea>

        <div class="grid">
            <div>
                <label>Match</label>
                <input type="number" name="match" value="1">
            </div>

            <div>
                <label>Mismatch</label>
                <input type="number" name="mismatch" value="-1">
            </div>

            <div>
                <label>Gap</label>
                <input type="number" name="gap" value="-2">
            </div>
        </div>

        <button type="submit">Align Sequences</button>

    </form>

    {% if result %}
    <div class="result">

        <h2>Alignment Score: {{ result.score }}</h2>

        <div class="alignment">
            <strong>Sequence 1:</strong><br>
            {{ result.aligned1 }}
        </div>

        <div class="alignment">
            <strong>Sequence 2:</strong><br>
            {{ result.aligned2 }}
        </div>

    </div>
    {% endif %}

</div>

</body>
</html>
